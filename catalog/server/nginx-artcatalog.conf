# ============================================================
#  Раздача статики онлайн-каталога «Арт-Ростов» со своего сервера
#  Файлы лежат в /home/develop/donexpo/static/artcatalog/
#
#  Фрагмент вставляется в server-блок сайта, который отдаёт
#  https://donexpocentre.ru/  (подставьте свой домен).
#  После правки: nginx -t && systemctl reload nginx
# ============================================================

location /static/artcatalog/ {
    alias /home/develop/donexpo/static/artcatalog/;

    # ГЛАВНОЕ. Каталог вставлен в страницу на другом домене (Tilda),
    # поэтому браузер считает эти файлы «чужими». Без разрешающего
    # заголовка он заблокирует загрузку artists.json и фирменного
    # шрифта — каталог покажет ошибку вместо зала.
    #
    # "*" — если каталог может встраиваться на любые ваши площадки.
    # Строже: указать конкретный домен страницы, например
    # add_header Access-Control-Allow-Origin "https://xn----7sbbahdd0aigfnbhu1n.xn--p1ai" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # правильные типы (иначе браузер откажется применять шрифт и webp)
    types {
        application/javascript  js;
        text/css                css;
        application/json        json;
        image/webp              webp;
        image/jpeg              jpg jpeg;
        image/png               png;
        font/woff2              woff2;
    }

    # сжатие: код каталога ужимается примерно втрое
    gzip             on;
    gzip_min_length  1024;
    gzip_types       application/javascript text/css application/json;

    # Картинки и шрифт не меняются — кешируем надолго.
    location ~* ^/static/artcatalog/.+\.(webp|jpe?g|png|woff2)$ {
        alias /home/develop/donexpo/static/artcatalog/;
        expires 30d;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # Код и данные — короткий кеш: обновления доезжают до посетителей
    # сами, без правки кода вставки на Tilda.
    location ~* ^/static/artcatalog/.+\.(js|css|json)$ {
        alias /home/develop/donexpo/static/artcatalog/;
        expires 5m;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        gzip on;
        gzip_types application/javascript text/css application/json;
    }
}
