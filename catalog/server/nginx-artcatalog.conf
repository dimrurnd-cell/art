# ============================================================
#  Раздача статики онлайн-каталога «Арт-Ростов» со своего сервера
#  Файлы: /home/develop/donexpo/static/artcatalog/
#
#  Вставляется ВНУТРЬ блока server { … } того сайта, который отдаёт
#  https://ваш-домен/ — рядом с остальными location.
#  После правки: sudo nginx -t && sudo systemctl reload nginx
# ============================================================

location /static/artcatalog/ {
    alias /home/develop/donexpo/static/artcatalog/;

    # ГЛАВНОЕ. Каталог вставлен в страницу на другом домене (Tilda),
    # поэтому браузер считает эти файлы «чужими». Без разрешающего
    # заголовка он заблокирует загрузку artists.json и фирменного
    # шрифта — вместо зала посетитель увидит сообщение об ошибке.
    #
    # "*" — если каталог может встраиваться на любые ваши площадки.
    # Строже: указать конкретный домен страницы, например
    # add_header Access-Control-Allow-Origin "https://xn----7sbh1cajbjfe.xn--p1ai" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # короткий кеш: правки доезжают до посетителей сами,
    # без замены адресов в блоках вставки на Tilda
    expires 10m;

    # код каталога ужимается примерно втрое
    gzip             on;
    gzip_min_length  1024;
    gzip_types       application/javascript text/css application/json;
}

# ------------------------------------------------------------
#  Необязательно: длинный кеш для картинок и шрифта.
#  Их имена не меняются, поэтому запрашивать их каждые 10 минут
#  незачем. Добавляйте ТОЛЬКО если предыдущий блок уже работает —
#  этот location задан регулярным выражением и имеет приоритет.
# ------------------------------------------------------------
# location ~* ^/static/artcatalog/(.+\.(?:webp|jpe?g|png|woff2))$ {
#     alias /home/develop/donexpo/static/artcatalog/$1;
#     add_header Access-Control-Allow-Origin "*" always;
#     add_header Cross-Origin-Resource-Policy "cross-origin" always;
#     expires 30d;
# }

# ------------------------------------------------------------
#  Если в конфиге УЖЕ есть location /static/ (обычно так и есть
#  у Django-проектов), отдельный блок можно не добавлять —
#  достаточно вписать в существующий две строки:
#
#      add_header Access-Control-Allow-Origin "*" always;
#      add_header Cross-Origin-Resource-Policy "cross-origin" always;
#
#  Заголовки применятся ко всей статике сайта. Это безопасно:
#  они разрешают читать только те файлы, что и так публичны,
#  и не открывают доступ к данным пользователей или API.
# ------------------------------------------------------------
