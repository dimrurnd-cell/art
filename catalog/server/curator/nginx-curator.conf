# ============================================================
#  Куратор: адрес https://ваш-домен/api/artcatalog/curator/ → служба на 127.0.0.1:8765
#
#  Вставить ВНУТРЬ того же блока server { … }, куда вставлен
#  location /static/artcatalog/ (сайт на 443, с ssl).
#  После правки: sudo nginx -t && sudo systemctl reload nginx
# ============================================================

location /api/artcatalog/curator/ {
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 40s;          # нейросеть отвечает до ~25 с
    client_max_body_size 16k;
}
