# ============================================================
#  Куратор: адрес https://ваш-домен/api/artcatalog/curator/ → служба на 127.0.0.1:8765
#
#  Вставить ВНУТРЬ того же блока server { … }, куда вставлен
#  location /static/artcatalog/ (сайт на 443, с ssl).
#  После правки: sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# По желанию — лимит запросов с одного адреса ещё до службы (поток запросов
# не занимает её потоки). Строку limit_req_zone — ВНЕ блока server { … }
# (например, первой строкой того же файла), строки limit_req — внутри location:
#limit_req_zone $binary_remote_addr zone=artcurator:1m rate=30r/m;

location /api/artcatalog/curator/ {
    #limit_req zone=artcurator burst=20 nodelay;
    #limit_req_status 429;
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 40s;          # нейросеть отвечает до ~25 с
    client_max_body_size 16k;
}
