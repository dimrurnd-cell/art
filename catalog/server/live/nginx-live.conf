# ============================================================
#  Онлайн-режим: https://ваш-домен/api/artcatalog/live/ → служба на 127.0.0.1:8767
#
#  Вставить ВНУТРЬ того же блока server { … }, где уже есть
#  location /api/artcatalog/curator/ (сайт на 443, с ssl).
#  После правки: sudo nginx -t && sudo systemctl reload nginx
# ============================================================

location /api/artcatalog/live/ {
    proxy_pass http://127.0.0.1:8767;
    proxy_http_version 1.1;                       # WebSocket — только HTTP/1.1
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;                        # соединение посетителя живёт, пока он на выставке
    proxy_send_timeout 1h;
    proxy_buffering off;
    client_max_body_size 64k;
}
